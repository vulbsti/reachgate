name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS job (public repo only; skipped while private)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: npm ci
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  test-macos:
    # macOS is manual-only: Actions -> CI -> Run workflow -> tick macos. Never runs while the repo is
    # private (macOS minutes bill at 10x), and never on push/PR.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos && !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  python39:
    # The Python adapter helper and the checkout example claim Python 3.9+.
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no prebuilt Python 3.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python --version
      - run: npm ci
      - run: node --test test/example-checkout-py.test.mjs

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fixed variant passes (exit 0)
        run: node bin/reachgate.mjs explore examples/dungeon/target.mjs#fixed --quiet
      - name: Seeded bug is found (exit 1)
        run: |
          code=0
          node bin/reachgate.mjs explore examples/dungeon/target.mjs --quiet || code=$?
          echo "exit code: $code"
          test "$code" -eq 1
