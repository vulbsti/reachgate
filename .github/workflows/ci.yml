name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: npm ci
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  python39:
    # The Python adapter helper and the checkout example claim Python 3.9+.
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no prebuilt Python 3.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python --version
      - run: npm ci
      - run: node --test test/example-checkout-py.test.mjs

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fixed variant passes (exit 0)
        run: node bin/reachgate.mjs explore examples/dungeon/target.mjs#fixed --quiet
      - name: Seeded bug is found (exit 1)
        run: |
          code=0
          node bin/reachgate.mjs explore examples/dungeon/target.mjs --quiet || code=$?
          echo "exit code: $code"
          test "$code" -eq 1
