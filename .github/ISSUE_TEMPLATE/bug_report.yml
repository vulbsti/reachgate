name: Bug report
description: reachgate did something wrong, crashed, or reported a wrong verdict.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through a private security advisory instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: reachgate version
      description: Output of `npx reachgate --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.11.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: true
  - type: dropdown
    id: target-kind
    attributes:
      label: Target kind
      options:
        - In-process JavaScript (.mjs/.js target)
        - Adapter (Python helper / .py target)
        - Adapter (--cmd, another language)
        - Not sure
    validations:
      required: true
  - type: input
    id: adapter-language
    attributes:
      label: Adapter language
      description: If you use an adapter, which language and version (e.g. Python 3.12, Go 1.23)?
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact reachgate command you ran, plus `reachgate.config.json` if you use one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: "`.reachgate/report.json` excerpt"
      description: The relevant part of the report (verdict, violations, witness, stoppedBy, warnings). Remove anything private.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, including the exit code and any error output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small target file (or link to one) that shows the problem, if you can share it.
